appId: com.lilong7676.little-desktop-buddy
productName: Little Desktop Buddy
directories:
  buildResources: build
  output: dist
files:
  - out/**
extraResources:
  - from: resources/tray.png
    to: tray.png
mac:
  category: public.app-category.entertainment
  # 无签名证书：本地/CI 均跳过签名，用户首次右键打开
  identity: null
  extendInfo:
    LSUIElement: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  deleteAppDataOnUninstall: true
publish:
  provider: github
